name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_HEKX_TOKEN: ${{ secrets.CARGO_REGISTRIES_HEKX_TOKEN }}

jobs:
  build-windows:
    name: Build Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.x"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $metadata = cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps | ConvertFrom-Json
          $bundleDir = Join-Path $metadata.target_directory "release/bundle/nsis"
          $installer = Get-ChildItem $bundleDir -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Windows NSIS installer was not generated"
          }

          New-Item -ItemType Directory -Force -Path release-dist | Out-Null
          Copy-Item $installer.FullName "release-dist/pdf-split_${version}_windows_x64-setup.exe"
          Get-ChildItem release-dist | Format-Table Name, Length

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: release-dist/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal package
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.x"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Universal DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Stage macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          target_dir=$(cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => console.log(JSON.parse(data).target_directory));')
          bundle_dir="$target_dir/universal-apple-darwin/release/bundle/dmg"
          dmg=$(find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"

          mkdir -p release-dist
          cp "$dmg" "release-dist/pdf-split_${version}_macOS_Universal.dmg"
          ls -lh release-dist

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-package
          path: release-dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release packages
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
